# Frozen BERT энкодер + TRM reasoning-голова (легаси bert_encoder).

experiment:
  name: bert_frozen_trm

model:
  arch: bert_trm
  params:
    encoder_name: bert-base-uncased
    encoder_local_path: null
    freeze_encoder: true
    add_trm_segment_embeddings: false
    hidden_size: 512
    num_heads: 8
    L_layers: 2
    H_layers: 2
    H_cycles: 2
    L_cycles: 4
    expansion: 4.0
    pos_encodings: rope
    halt_max_steps: 1
    halt_exploration_prob: 0.0
    no_ACT_continue: true
    mlp_t: false

training:
  per_device_batch_size: 256
  eval_batch_size: 256
